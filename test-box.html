<!DOCTYPE html>
<html>
<head>
<style>
  .container { width: 100px; height: 100px; border: 1px solid black; }
  .child { width: calc(100% + 10px); height: 100%; background: red; }
</style>
</head>
<body>
  <div class="container" id="c"><div class="child"></div></div>
  <script>
    console.log(document.getElementById('c').getBoundingClientRect().width);
  </script>
</body>
</html>
